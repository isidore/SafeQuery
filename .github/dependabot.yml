version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "- r "
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "- r "
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ". e "
