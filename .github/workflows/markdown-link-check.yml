name: Check Markdown links

on:
    push:
    workflow_dispatch:
    schedule:
        - cron: '13 5 * * 0'  # [https://crontab.guru/#13_5_*_*_0](At 05:13 on Sunday)

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: tcort/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
