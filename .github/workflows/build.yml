name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '14 7 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: ./build_and_test.sh
      - run: dotnet pack src/SafeQuery -c Release --no-build -o artifacts -p:Version=0.0.0-ci.${{ github.run_number }}
